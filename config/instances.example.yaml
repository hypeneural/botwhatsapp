# Fonte de referência editorial: docs/FORENSIC-AUDIT-2026-10-21.md
# O serviço Go PREVIEW usa variáveis em .env.example; este YAML é a matriz de configuração FUTURA.
# CONFIGURAÇÃO DE EXEMPLO. NÃO ATIVAR sem validação.
enabled: false
evolution:
  base_url_env: EVOLUTION_GO_BASE_URL
  installed_version: null
  installed_digest: null
crm:
  base_url_env: EVIDENCIA_CRM_BASE_URL
  authorization_env: EVIDENCIA_CRM_AUTHORIZATION
  default_campaign_id: 416 # FIXO para Meta Ads: sem nome
  allow_with_name_variant: false # NÃO inferir pelo pushName
  available_with_name_id: 415 # somente opt-in futuro explícito; inativo no bot
  live_campaign_readiness_verified: false # confirmação operacional ainda pendente
  live_message_instance_verified: false # confirmação operacional ainda pendente
  outbound_message_instance_id: null # OBRIGATÓRIO explícito e >0 para produção, jamais escolher automaticamente favorito
instances:
  paid_traffic:
    enabled: false
    business_phone_e164: "554832200440"
    instance_uuid: null
    token_env: EVOLUTION_ADS_APIKEY
    exact_ad_phrases: []
    response_text: "Oii! Tudo bem? 🎄❤️ Que alegria receber seu contato! Vamos enviar a proposta de Natal 2026 por outro WhatsApp oficial do Estúdio Evidência."
    audio_file: null
    fallback_menu_enabled: true
  greeting:
    enabled: false
    business_phone_e164: "5548996425287"
    instance_uuid: null
    token_env: EVOLUTION_GREETING_APIKEY
    image_file: null
    caption_file: config/greeting-caption.txt
    cooldown_hours: 24
    menu:
      "1": natal
      "2": agendamento
      "3": pedidos
      "4": localizacao
      "5": humano
    location_url: https://ir.fotosdenatal.com/

# CRM sempre usa contacts nacional (DDD + 10/11 dígitos), sem DDI 55;
# valor no campo instance é message_instances.id, NÃO UUID da Evolution Go.
