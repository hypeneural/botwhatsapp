name: Go security and offline contract checks
on:
  push:
    paths:
      - 'go.mod'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'scripts/**'
      - 'deploy/caddy/**'
      - 'testdata/**'
      - '.github/workflows/go-test.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'scripts/**'
      - 'deploy/caddy/**'
      - '.github/workflows/go-test.yml'
concurrency:
  group: botwhatsapp-go-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
      # Strictly offline fake-config release preflight (no credentials/network).
      - run: bash scripts/preflight-ctwa-production-readonly.test.sh
      - run: python3 scripts/configure-ctwa-secrets.test.py -v
      - run: python3 scripts/audit-ctwa-panel-readonly.test.py -v
      - run: python3 scripts/sync-ctwa-crm-names-readonly.test.py -v
      - run: python3 scripts/validate-ctwa-crm-contract.py
      - run: python3 scripts/audit-ctwa-legacy-422-readonly.test.py -v
      - run: bash -n scripts/audit-ctwa-dns-readonly.sh
      - run: python3 -m py_compile scripts/audit_relay_spool_readonly.py scripts/preflight_evolution_relay_contract_readonly.py
      - run: python3 -m unittest scripts/test_relay_forensic_readonly.py -v
      - run: python3 -m py_compile scripts/preflight_ctwa_account_switch.py
      - run: python3 -m unittest scripts/test_preflight_ctwa_account_switch.py -v
      # Concurrency guard for the journal, policy updates and webhook fan-out.
      # Runs once per code change; no network calls or production credentials.
      - run: go test -race -count=1 ./internal/outbox ./internal/ingress ./internal/relay
