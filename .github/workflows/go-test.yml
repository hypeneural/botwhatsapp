name: Go security and offline contract checks
on:
  push:
    paths:
      - 'go.mod'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - 'config/**'
      - 'testdata/**'
      - '.github/workflows/go-test.yml'
  pull_request:
    paths:
      - 'go.mod'
      - 'Dockerfile'
      - 'cmd/**'
      - 'internal/**'
      - '.github/workflows/go-test.yml'
concurrency:
  group: botwhatsapp-go-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v6
        with:
          go-version: '1.27.3'
          cache: false
      - run: go vet ./...
      - run: go test -count=1 ./...
